<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LawnSync · Bitácora Inteligente de Aplicaciones</title>
  
  <meta name="theme-color" content="#032813">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LawnSync">
  <meta name="description" content="Gestión profesional y bitácora de fertilización para césped St. Augustine">

  <!-- Iconos vinculados a tu archivo icon.png -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f2fbf5',
              100: '#e1f7e8',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#064e3b',
              accent: '#65c200'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'glow-emerald': '0 0 24px -4px rgba(101, 194, 0, 0.25)',
            'card-subtle': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'card-dark': '0 4px 20px -2px rgba(0, 0, 0, 0.4)'
          }
        }
      }
    }
  </script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .dark .glass-header {
      background: rgba(15, 23, 42, 0.85);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 font-sans antialiased min-h-full flex flex-col transition-colors duration-300">

  <header class="w-full glass-header border-b border-slate-200/80 dark:border-slate-800/80 transition-colors">
    <div class="max-w-2xl mx-auto px-4 py-3.5 sm:px-6">
      <div class="flex items-center justify-between gap-3">
        
        <div class="flex items-center gap-3">
          <!-- Tu imagen oficial icon.png como logo -->
          <div class="w-11 h-11 rounded-2xl overflow-hidden shadow-md ring-1 ring-emerald-500/30 shrink-0 bg-slate-900">
            <img src="icon.png" alt="LawnSync Logo" class="w-full h-full object-cover">
          </div>

          <div>
            <div class="flex items-center gap-2">
              <span class="font-display font-extrabold text-2xl tracking-tight leading-none">
                <span class="text-emerald-950 dark:text-white">Lawn</span><span class="text-[#65c200]">Sync</span>
              </span>
              <span class="text-[10px] font-bold tracking-wide px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-200/80 dark:border-emerald-800/80">St. Augustine</span>
            </div>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium mt-0.5">Programa de Tratamiento LESCO</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="pwa-install-btn" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold shadow-md active:scale-95 transition-all">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Instalar</span>
          </button>

          <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 text-slate-600 dark:text-slate-300 shadow-sm active:scale-90 transition-transform">
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
            <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
          </button>
        </div>

      </div>
    </div>
  </header>

  <div id="banner-alert" class="max-w-2xl mx-auto px-4 mt-4 hidden w-full">
    <div id="banner-inner" class="p-4 rounded-2xl flex items-start gap-3.5 shadow-sm border transition-all">
      <div id="banner-icon" class="p-2.5 rounded-xl shrink-0 mt-0.5"></div>
      <div class="flex-1 min-w-0">
        <h4 id="banner-title" class="text-xs font-bold uppercase tracking-wider mb-0.5"></h4>
        <p id="banner-text" class="text-sm font-semibold leading-snug"></p>
      </div>
    </div>
  </div>

  <main class="max-w-2xl mx-auto px-4 py-5 flex-1 w-full space-y-4">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center bg-slate-200/70 dark:bg-slate-900/90 p-1 rounded-2xl border border-slate-200/60 dark:border-slate-800 text-xs font-semibold no-scrollbar overflow-x-auto w-full sm:w-auto shadow-inner">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-1.5 rounded-xl transition-all font-bold bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm whitespace-nowrap">Todos</button>
        <button onclick="setFilter('activa')" id="filter-activa" class="filter-btn px-3.5 py-1.5 rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 whitespace-nowrap">Activas</button>
        <button onclick="setFilter('proxima')" id="filter-proxima" class="filter-btn px-3.5 py-1.5 rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 whitespace-nowrap">Próximas</button>
        <button onclick="setFilter('completada')" id="filter-completada" class="filter-btn px-3.5 py-1.5 rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 whitespace-nowrap">Completadas</button>
      </div>

      <button onclick="resetAllLogs()" class="text-xs text-slate-400 hover:text-rose-500 transition-colors p-2 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/30 shrink-0" title="Reiniciar marcas del año">
        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="space-y-3.5" id="timeline-container"></div>
  </main>

  <footer class="mt-auto border-t border-slate-200/70 dark:border-slate-800/80 bg-white/50 dark:bg-slate-900/50 py-4 text-center text-xs text-slate-500 dark:text-slate-400">
    <div class="max-w-2xl mx-auto px-4 flex items-center justify-center gap-2 font-display font-medium">
      <i data-lucide="shield-check" class="w-4 h-4 text-[#65c200]"></i>
      <span>LawnSync · Bitácora de Césped</span>
    </div>
  </footer>

  <script>
    const PHASES = [
      { id:'stonewall-feb', start:[2,15], end:[2,28], fase:'Pre-Emergencia Estival', producto:'LESCO Stonewall 0.37% / 0.43% Plus Fertilizer', formula:'0-0-7 (Prodiamina 0.37% / 0.43%)', nota:'Crea la barrera química pre-emergente cuando la temperatura del suelo alcanza 52–55°F sostenidos. Previene malezas estivales comunes. Regar con 0.25–0.5 pulgadas dentro de 14 días.' },
      { id:'atrazine-mar', start:[3,1], end:[3,20], fase:'Control Post y Pre-Emergente Temprano', producto:'LESCO Atrazine 1.05% Plus Fertilizer', formula:'18-0-10 (56% PolyPlus OPTI45, Fe, Mn, Mg) o 21-0-7', nota:'Control selectivo de malezas de hoja ancha y supresión residual.', aviso:'No aplicar sobre 85°F en césped Floratam' },
      { id:'acelepryn-abr', start:[4,15], end:[4,30], fase:'Nutrición Primaveral y Control de Plagas', producto:'LESCO Acelepryn 0.067% Plus Fertilizer / Spar-TECH', formula:'24-0-8 (Clorantraniliprol 0.067%, 40% PolyPlus OPTI45)', nota:'Fertilización estratégica previa al inicio de la veda. Control preventivo de orugas, larvas y chinches sin inducir resistencia.' },
      { id:'carbonpro-jun', start:[6,1], end:[6,15], fase:'Estabilización Edáfica Estival', producto:'LESCO CarbonPro-G Soil Amendment', formula:'0-0-0 (Biocarbón, Ácidos Húmicos, Bacterias, Micorrizas)', nota:'Acondicionamiento biológico del suelo en temporada cálida. Incrementa retención de humedad y capacidad de intercambio catiónico.', veda:true },
      { id:'hierro-jul', start:[7,15], end:[7,30], fase:'Verdor de Verano e Inmunidad Térmica', producto:'LESCO Chelated Iron / Micronutrient Granular', formula:'0-0-7 con Fe quelado, Mn y Mg', nota:'Corrige la clorosis por pH alcalino con hierro y manganeso. Estimula fotosíntesis sin provocar crecimiento foliar excesivo.', veda:true },
      { id:'carbonpro-ago', start:[8,15], end:[8,30], fase:'Enmienda Biológica — Mitigación de Lixiviación', producto:'LESCO CarbonPro-G o Moisture Manager', formula:'Biocarbón + Húmicos / Polímeros no iónicos', nota:'Regenera la biomasa microbiana tras lavado de lluvias estivales optimizando la absorción otoñal.', veda:true },
      { id:'reactivacion-oct', start:[10,1], end:[10,15], fase:'Reactivación Nutricional y Pre-Emergencia', producto:'LESCO 24-0-11 PolyPlus + Stonewall 0.43%', formula:'24-0-11 (50% SRN) + 0-0-7 (Prodiamina 0.43%)', nota:'Fertilización de recuperación post-veda y segunda barrera contra malezas de invierno.' },
      { id:'endurecimiento-nov', start:[11,15], end:[12,5], fase:'Endurecimiento Radicular y Preparación Invernal', producto:'LESCO 5-0-20 Spar-TECH o LESCO 10-0-22', formula:'5-0-20 o 10-0-22 (0% Fósforo, alto Potasio)', nota:'Alto potasio soluble para acumular carbohidratos en estolones y aumentar la resistencia al frío.' }
    ];

    const MESES = ['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const YEAR = hoy.getFullYear();
    let currentFilter = 'all';
    let store = {};

    function toDate(m, d) { return new Date(YEAR, m-1, d); }
    function fmt(m, d) { return `${d} ${MESES[m]}`; }

    function computeStatus(p){
      const start = toDate(p.start[0], p.start[1]);
      const end = toDate(p.end[0], p.end[1]);
      if (hoy >= start && hoy <= end) return 'activa';
      if (hoy < start) return 'proxima';
      return 'vencida';
    }

    function getStatusPriority(status) {
      if (status === 'activa') return 1;
      if (status === 'proxima') return 2;
      if (status === 'vencida') return 3;
      return 4;
    }

    function downloadCalendar(p) {
      const formatDate = (m, d) => `${YEAR}${m.toString().padStart(2,'0')}${d.toString().padStart(2,'0')}`;
      const ics = [
        "BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT",
        `SUMMARY:LawnSync: ${p.fase}`,
        `DTSTART:${formatDate(p.start[0], p.start[1])}`,
        `DTEND:${formatDate(p.end[0], p.end[1])}`,
        `DESCRIPTION:Producto: ${p.producto}\\nFórmula: ${p.formula}\\nNota: ${p.nota}`,
        "BEGIN:VALARM", "TRIGGER:-PT1H", "ACTION:DISPLAY", "DESCRIPTION:Recordatorio de Aplicación LawnSync", "END:VALARM",
        "END:VEVENT", "END:VCALENDAR"
      ].join("\r\n");
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `LawnSync_${p.id}.ics`;
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    function loadStore() {
      const saved = localStorage.getItem(`lawnsync_store_${YEAR}`);
      if (saved) {
        try { store = JSON.parse(saved); } catch(e) { store = {}; }
      }
    }

    function saveStore() {
      localStorage.setItem(`lawnsync_store_${YEAR}`, JSON.stringify(store));
    }

    function toggleComplete(pId) {
      if (store[pId] && store[pId].completed) {
        delete store[pId];
      } else {
        store[pId] = { completed: true, fecha: hoy.toISOString().slice(0, 10) };
      }
      saveStore();
      render();
    }

    function resetAllLogs() {
      if (confirm('¿Deseas reiniciar todas las marcas del año actual?')) {
        store = {};
        saveStore();
        render();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'font-bold');
        btn.classList.add('text-slate-600', 'dark:text-slate-400');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-900', 'dark:text-white', 'shadow-sm', 'font-bold');
        activeBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
      }
      render();
    }

    function initDarkMode() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
      }
    }

    function render() {
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      let activeNow = null;
      let nextUpcoming = null;

      const phasesWithStatus = PHASES.map(p => {
        const rec = store[p.id];
        let status = computeStatus(p);
        if (rec && rec.completed) status = 'completada';

        if (status === 'activa') activeNow = p;
        if (status === 'proxima' && !nextUpcoming) nextUpcoming = p;

        return { ...p, status, rec };
      });

      phasesWithStatus.sort((a, b) => {
        const prioA = getStatusPriority(a.status);
        const prioB = getStatusPriority(b.status);
        if (prioA !== prioB) return prioA - prioB;
        return toDate(a.start[0], a.start[1]) - toDate(b.start[0], b.start[1]);
      });

      phasesWithStatus.forEach((p) => {
        const rec = p.rec;
        const status = p.status;

        if (currentFilter !== 'all' && status !== currentFilter) return;

        const statusConfigs = {
          activa: {
            border: 'border-emerald-500/80 dark:border-emerald-500/80 ring-2 ring-emerald-500/20 shadow-glow-emerald',
            bg: 'bg-white dark:bg-[#0f172a]',
            badgeBg: 'bg-emerald-500 text-white font-bold',
            badgeText: 'Activa Ahora',
            icon: 'play-circle',
            iconColor: 'text-[#65c200]'
          },
          proxima: {
            border: 'border-slate-200/90 dark:border-slate-800/90 shadow-card-subtle dark:shadow-card-dark',
            bg: 'bg-white dark:bg-[#0f172a]',
            badgeBg: 'bg-amber-100 text-amber-900 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-800',
            badgeText: 'Próxima',
            icon: 'clock',
            iconColor: 'text-amber-500'
          },
          vencida: {
            border: 'border-slate-200/80 dark:border-slate-800/80',
            bg: 'bg-white dark:bg-[#0f172a]',
            badgeBg: 'bg-rose-100 text-rose-800 dark:bg-rose-950/80 dark:text-rose-300 border border-rose-200 dark:border-rose-800',
            badgeText: 'Sin Registrar',
            icon: 'alert-circle',
            iconColor: 'text-rose-500'
          },
          completada: {
            border: 'border-slate-200/60 dark:border-slate-800/50 opacity-75',
            bg: 'bg-slate-50/80 dark:bg-[#090e1a]/60',
            badgeBg: 'bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-400 border border-slate-300 dark:border-slate-700',
            badgeText: 'Completada',
            icon: 'check-circle-2',
            iconColor: 'text-emerald-600 dark:text-emerald-400'
          }
        };

        const config = statusConfigs[status];
        const card = document.createElement('div');
        card.className = `rounded-3xl border p-4 sm:p-5 transition-all duration-200 ${config.border} ${config.bg} relative overflow-hidden`;

        let statusNote = '';
        if (rec && rec.completed) {
          statusNote = `<span class="text-[11px] font-mono text-emerald-600 dark:text-emerald-400 flex items-center gap-1 font-semibold"><i data-lucide="check" class="w-3.5 h-3.5"></i> ${rec.fecha}</span>`;
        } else if (status === 'proxima') {
          const dias = Math.round((toDate(p.start[0], p.start[1]) - hoy) / 86400000);
          statusNote = `<span class="text-[11px] font-mono text-slate-500 dark:text-slate-400">En ${dias} día${dias === 1 ? '' : 's'}</span>`;
        } else if (status === 'vencida') {
          statusNote = `<span class="text-[11px] font-mono text-rose-500 font-medium">Ventana pasada</span>`;
        } else {
          statusNote = `<span class="text-[11px] font-mono text-emerald-600 dark:text-[#65c200] font-bold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-[#65c200] animate-ping"></span> Aplicar hoy</span>`;
        }

        const safeObj = JSON.stringify({ id: p.id, fase: p.fase, producto: p.producto, formula: p.formula, nota: p.nota, start: p.start, end: p.end }).replace(/"/g, '&quot;');

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-2">
              <i data-lucide="${config.icon}" class="w-4 h-4 ${config.iconColor} shrink-0"></i>
              <span class="font-mono text-xs font-semibold text-slate-500 dark:text-slate-400">
                ${fmt(p.start[0], p.start[1])} – ${fmt(p.end[0], p.end[1])}
              </span>
            </div>
            
            <div class="flex items-center gap-1.5">
              <button onclick="downloadCalendar(${safeObj})" class="p-1.5 rounded-lg text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Añadir a Calendario">
                <i data-lucide="calendar-plus" class="w-4 h-4"></i>
              </button>
              <span class="text-[10px] font-bold tracking-wide px-2.5 py-0.5 rounded-full ${config.badgeBg}">
                ${config.badgeText}
              </span>
            </div>
          </div>

          <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white leading-snug mb-1">
            ${p.fase}
          </h3>

          <p class="text-sm font-semibold text-emerald-800 dark:text-emerald-300 mb-3 flex items-center gap-1.5">
            <i data-lucide="package" class="w-4 h-4 shrink-0 text-emerald-600 dark:text-emerald-400"></i>
            ${p.producto}
          </p>

          <div class="flex flex-wrap gap-1.5 mb-3">
            <span class="px-2.5 py-1 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-900 dark:text-emerald-200 font-mono text-xs font-semibold border border-emerald-200/60 dark:border-emerald-800/40">
              ${p.formula}
            </span>
            ${p.veda ? `<span class="px-2.5 py-1 rounded-xl bg-purple-50 dark:bg-purple-950/50 text-purple-700 dark:text-purple-300 font-mono text-xs font-semibold border border-purple-200/70 dark:border-purple-800/50 flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3 h-3"></i> Veda N/P</span>` : ''}
            ${p.aviso ? `<span class="px-2.5 py-1 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 font-mono text-xs font-semibold border border-amber-200/70 dark:border-amber-800/50 flex items-center gap-1"><i data-lucide="thermometer-snowflake" class="w-3 h-3"></i> T. &lt; 85°F</span>` : ''}
          </div>

          <details class="group/det mb-3.5">
            <summary class="cursor-pointer text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 flex items-center gap-1 transition-colors select-none">
              <i data-lucide="chevron-right" class="w-3.5 h-3.5 transition-transform duration-200 group-open/det:rotate-90"></i>
              <span>Guía Técnica</span>
            </summary>
            <p class="mt-2 text-xs text-slate-600 dark:text-slate-300 leading-relaxed bg-slate-100/70 dark:bg-slate-800/50 p-3 rounded-2xl border border-slate-200/50 dark:border-slate-800">
              ${p.nota}
            </p>
          </details>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between gap-3">
            <div>${statusNote}</div>
            
            <button onclick="toggleComplete('${p.id}')" class="px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 active:scale-95 shadow-sm ${
              rec && rec.completed 
                ? 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700' 
                : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20'
            }">
              <i data-lucide="${rec && rec.completed ? 'undo-2' : 'check'}" class="w-3.5 h-3.5"></i>
              <span>${rec && rec.completed ? 'Desmarcar' : 'Completar'}</span>
            </button>
          </div>
        `;

        container.appendChild(card);
      });

      const banner = document.getElementById('banner-alert');
      const bannerInner = document.getElementById('banner-inner');
      const bannerTitle = document.getElementById('banner-title');
      const bannerText = document.getElementById('banner-text');
      const bannerIcon = document.getElementById('banner-icon');

      if (activeNow) {
        banner.classList.remove('hidden');
        bannerInner.className = 'p-4 rounded-2xl flex items-start gap-3 shadow-md bg-emerald-50 dark:bg-[#062419] border border-emerald-300 dark:border-emerald-700/80 transition-colors';
        bannerTitle.className = 'text-xs font-bold uppercase tracking-wider mb-0.5 text-emerald-950 dark:text-[#65c200]';
        bannerText.className = 'text-sm font-semibold text-emerald-950 dark:text-slate-100 leading-snug';
        bannerIcon.className = 'p-2 rounded-xl shrink-0 mt-0.5 bg-emerald-600 text-white shadow-sm';
        bannerIcon.innerHTML = `<i data-lucide="bell-ring" class="w-4 h-4"></i>`;
        bannerTitle.textContent = 'Tratamiento Activo en este Momento';
        bannerText.textContent = `${activeNow.fase} · ${activeNow.producto}`;
      } else if (nextUpcoming) {
        const dias = Math.round((toDate(nextUpcoming.start[0], nextUpcoming.start[1]) - hoy) / 86400000);
        if (dias <= 10) {
          banner.classList.remove('hidden');
          bannerInner.className = 'p-4 rounded-2xl flex items-start gap-3.5 shadow-md bg-amber-50 dark:bg-[#231704] border border-amber-300 dark:border-amber-700/80 transition-colors';
          bannerTitle.className = 'text-xs font-bold uppercase tracking-wider mb-0.5 text-amber-950 dark:text-amber-400';
          bannerText.className = 'text-sm font-semibold text-amber-950 dark:text-slate-100 leading-snug';
          bannerIcon.className = 'p-2 rounded-xl shrink-0 mt-0.5 bg-amber-600 text-white shadow-sm';
          bannerIcon.innerHTML = `<i data-lucide="calendar-clock" class="w-4 h-4"></i>`;
          bannerTitle.textContent = `Próxima Aplicación en ${dias} día${dias===1?'':'s'}`;
          bannerText.textContent = `Prepárate para "${nextUpcoming.fase}" (${fmt(nextUpcoming.start[0], nextUpcoming.start[1])}).`;
        } else {
          banner.classList.add('hidden');
        }
      } else {
        banner.classList.add('hidden');
      }

      lucide.createIcons();
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('pwa-install-btn');
      installBtn.classList.remove('hidden');
      installBtn.classList.add('flex');
    });

    document.getElementById('pwa-install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-install-btn').classList.add('hidden');
        }
        deferredPrompt = null;
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('PWA Service Worker listo'))
          .catch((err) => console.log('SW Error:', err));
      });
    }

    initDarkMode();
    loadStore();
    render();
  </script>
</body>
</html>
